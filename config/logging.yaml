version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  json:
    format: '{"time":"%(asctime)s","level":"%(levelname)s","logger":"%(name)s","message":"%(message)s"}'
    datefmt: "%Y-%m-%dT%H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: data/secure_rag.log
    maxBytes: 10485760  # 10 MB
    backupCount: 3
    encoding: utf-8

root:
  level: INFO
  handlers: [console]

loggers:
  secure_rag:
    level: INFO
    handlers: [console]
    propagate: false
  secure_rag.audit:
    level: INFO
    handlers: [console]
    propagate: false
  uvicorn:
    level: WARNING
    handlers: [console]
    propagate: false

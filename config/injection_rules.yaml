# config/injection_rules.yaml — Regex and keyword signatures for prompt injection detection
# Used by security/scanner.py to score retrieved chunks for indirect injection risk.
# Each rule has a pattern (regex), description, and weight [0.0–1.0].

rules:
  # Direct instruction override attempts
  - id: ignore_previous
    pattern: "(?i)(ignore|disregard|forget|override|bypass)\\s+(all\\s+)?(previous|prior|above|earlier|system)\\s+(instructions?|prompts?|rules?|directives?)"
    description: "Attempts to override system instructions"
    weight: 0.85

  - id: system_prompt_leak
    pattern: "(?i)(show|reveal|display|print|output|repeat|echo)\\s+(me\\s+)?(the\\s+)?(system\\s+prompt|system\\s+message|initial\\s+instructions?|hidden\\s+instructions?|your\\s+instructions?)"
    description: "Attempts to extract system prompt"
    weight: 0.80

  # Avoid bare "act as" (normal workplace prose). Keep jailbreak-style hijacks.
  - id: role_override
    pattern: "(?i)(you\\s+are\\s+now|pretend\\s+(to\\s+be|you\\s+are)|assume\\s+the\\s+role|roleplay\\s+as|switch\\s+to\\s+(DAN|god\\s+mode)|new\\s+persona)"
    description: "Role/persona hijacking attempt"
    weight: 0.75

  # Delimiter injection
  - id: delimiter_injection_system
    pattern: "(?i)(<\\/?system>|\\[\\/?(INST|SYS|SYSTEM|USER\\s+QUESTION|CONTEXT|RECENT_CHAT|INSTRUCTION|PROMPT)[^\\]]*\\]|<\\|im_start\\|>|<\\|im_end\\|>|<<SYS>>|<\\/SYS>)"
    description: "LLM delimiter/tag injection"
    weight: 0.90

  # Require XML-like role tags; do not match handbook headings like "### User responsibilities"
  - id: delimiter_injection_xml
    pattern: "(?i)(<\\/?assistant>|<\\/?user>|<\\/?human>|<\\/?ai>|###\\s*(System|User|Assistant)\\s*:)"
    description: "XML/markdown role delimiter injection"
    weight: 0.80

  # Suspicious data-URI / IP exfil style URLs (plain https links in docs are common)
  - id: exfil_url
    pattern: "(?i)(data:text\\/|ftp://\\S{20,}|(https?://(?:\\d{1,3}\\.){3}\\d{1,3}|https?://localhost)[^\\s]{8,}|https?://[^\\s]{40,}[?&](token|key|secret|password)=)"
    description: "Potential data exfiltration via suspicious URL"
    weight: 0.60

  - id: exfil_encoding
    pattern: "(?i)(base64|rot13|atob|btoa)\\s*[:(]"
    description: "Encoding-based obfuscation or exfiltration"
    weight: 0.55

  - id: exfil_markdown_image
    pattern: "!\\[[^\\]]*\\]\\((?:https?://(?:\\d{1,3}\\.){3}\\d{1,3}|data:)[^)]+\\)"
    description: "Markdown image exfiltration vector"
    weight: 0.65

  # Command/code injection — word boundaries so "evaluation" / "execute" do not match
  - id: code_injection
    pattern: "(?i)(\\beval\\b|\\bexec\\b|\\bimport\\s+os\\b|\\bsubprocess\\b|__import__|\\bos\\.system\\b|\\bos\\.popen\\b)"
    description: "Code/command injection attempt"
    weight: 0.70

  # High-confidence prompt extraction markers only
  - id: prompt_leak_keywords
    pattern: "(?i)(BEGIN\\s+HIDDEN|END\\s+HIDDEN|CONFIDENTIAL\\s+PROMPT)"
    description: "Markers suggesting prompt extraction payload"
    weight: 0.50

  # Jailbreak patterns — avoid bare "developer mode" (common IT prose)
  - id: jailbreak_dan
    pattern: "(?i)(DAN\\s*mode|do\\s+anything\\s+now|\\bjailbreak\\b|god\\s+mode|unrestricted\\s+mode)"
    description: "Known jailbreak prompt patterns"
    weight: 0.85

  # Invisible CSS / HTML cloaking payload
  - id: hidden_css_injection
    pattern: "(?i)(style\\s*=\\s*['\"][^'\"]*(?:display\\s*:\\s*none|font-size\\s*:\\s*0|visibility\\s*:\\s*hidden|opacity\\s*:\\s*0))"
    description: "Invisible HTML/CSS text cloaking attack"
    weight: 0.75

  # Suspicious instruction inside HTML comments
  - id: instruction_in_html_comment
    pattern: "(?i)<!--[\\s\\S]*?(?:ignore|system|instruction|prompt|override)[\\s\\S]*?-->"
    description: "Adversarial instructions hidden in HTML comments"
    weight: 0.70
